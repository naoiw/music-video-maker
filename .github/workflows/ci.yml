name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend and typecheck
        run: pnpm run build
      - name: Frontend tests
        run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Cargo lockfile
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: false
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify FFmpeg integration
        run: |
          # Test-only FFmpeg; fetched from upstream and never uploaded.
          $archive = Join-Path $env:RUNNER_TEMP 'mvm-ci-ffmpeg.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mvm-ci-ffmpeg'
          curl.exe --fail --location --retry 3 --max-time 300 --output $archive https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') { throw 'FFmpeg archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -ErrorAction Stop
          $bin = Join-Path $destination 'ffmpeg-8.1.2-essentials_build/bin'
          $env:Path = "$bin;$env:Path"
          $bin >> $env:GITHUB_PATH
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            if ((Get-Command $name -CommandType Application | Select-Object -First 1).Source -ne (Join-Path $bin $name)) { throw "Unexpected tool path: $name" }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # All FFmpeg-dependent tests are marked #[ignore] so the unit suite works without FFmpeg.
          # Run every ignored test here rather than depending on test-name prefixes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check setup script syntax
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error }
      - name: Build desktop executable using user batch
        shell: cmd
        run: build.bat --no-pause
      - name: Verify dependency lockfiles unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  validate-unix:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg xvfb xauth dbus-x11
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Validate shell scripts and environment
        run: |
          for script in setup.sh build.sh run.sh scripts/unix-env.sh; do bash -n "$script"; done
          bash setup.sh --check
          ffmpeg -version
          ffprobe -version
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend and typecheck
        run: pnpm run build
      - name: Frontend tests
        run: pnpm test
      - name: Verify Cargo lockfile
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: false
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify FFmpeg integration
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --ignored --test-threads=1
      - name: Build desktop executable using user script
        run: bash build.sh --skip-install
      - name: Linux application startup smoke test
        if: runner.os == 'Linux'
        run: |
          # This is a process-liveness check, not a GUI interaction test.
          set +e
          timeout 10s xvfb-run -a dbus-run-session -- bash run.sh
          status=$?
          set -e
          if [[ "$status" != 124 ]]; then
            echo "Application exited before smoke-test timeout: $status"
            exit 1
          fi
      - name: Verify dependency lockfiles unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
