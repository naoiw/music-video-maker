name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install frontend dependencies
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend and typecheck
        run: npm run build
      - name: Frontend tests
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve Cargo dependencies
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) {
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: false
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify FFmpeg integration
        run: |
          # Test-only candidate; no FFmpeg binaries are included in the CI artifact.
          $lock = Get-Content packaging/ffmpeg-lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'mvm-ci-ffmpeg.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mvm-ci-ffmpeg'
          curl.exe --fail --location --retry 3 --retry-delay 2 --max-time 300 --output $archive $lock.binaryArchive.url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $lock.binaryArchive.sha256) { throw 'FFmpeg archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -ErrorAction Stop
          $bin = Join-Path (Join-Path $destination $lock.binaryArchive.directory) 'bin'
          $env:Path = "$bin;$env:Path"
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            if ((Get-Command $name -CommandType Application | Select-Object -First 1).Source -ne (Join-Path $bin $name)) { throw "Unexpected tool path: $name" }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # All FFmpeg-dependent tests are marked #[ignore] so the unit suite works without FFmpeg.
          # Run every ignored test here rather than depending on test-name prefixes.
          cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop executable
        run: npm run desktop:build
      - name: Upload executable for smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: src-tauri/target/release/music-video-maker.exe
          if-no-files-found: error
