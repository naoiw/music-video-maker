          npm run package:windows -- (Join-Path $inputs 'ffmpeg.zip') (Join-Path $inputs 'corresponding-source.zip') (Join-Path $inputs 'third-party-notices.txt') $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpacked = Join-Path $env:RUNNER_TEMP 'mvm-release-verify'
          New-Item -ItemType Directory -Path $unpacked -ErrorAction Stop | Out-Null
          tar.exe -xf $zip -C $unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundled = Join-Path $unpacked 'Music Video Maker'
          foreach ($name in @('music-video-maker.exe','ffmpeg.exe','ffprobe.exe','LICENSE','README.txt','third-party/FFmpeg-LICENSE.txt','third-party/THIRD-PARTY-NOTICES.txt','third-party/corresponding-source.zip','third-party/ffmpeg-lock.json')) {
            if (-not (Test-Path (Join-Path $bundled $name) -PathType Leaf)) { throw "Missing package file: $name" }
          }
          $env:Path = "$bundled;$env:Path"
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            if ((Get-Command $name -CommandType Application | Select-Object -First 1).Source -ne (Join-Path $bundled $name)) { throw "Unexpected tool path: $name" }
          }
          cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $output 'SHA256SUMS.txt') -Value "$hash  $(Split-Path $zip -Leaf)" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/mvm-release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: distribution
      - name: Verify artifacts and publish release
        shell: bash
        working-directory: distribution
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
